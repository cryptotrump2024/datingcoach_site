<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0}body{width:794px;height:1123px;background:#1a1218}</style></head><body><svg width="794" height="1123" xmlns="http://www.w3.org/2000/svg">
<defs>
    <radialGradient id="rg1" cx="75%" cy="25%" r="60%">
        <stop offset="0%" stop-color="#8B4557" stop-opacity="0.25"/>
        <stop offset="50%" stop-color="#6B3A5B" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#1a1218" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="15%" cy="85%" r="50%">
        <stop offset="0%" stop-color="#B8860B" stop-opacity="0.18"/>
        <stop offset="60%" stop-color="#6B3A5B" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#1a1218" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#D4A017" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#8B4557" stop-opacity="0.03"/>
    </linearGradient>
</defs>

<!-- Base gradient overlay -->
<rect width="100%" height="100%" fill="url(#lg1)"/>

<!-- Top-right rose glow -->
<ellipse cx="580" cy="250" rx="350" ry="250" fill="url(#rg1)"/>

<!-- Bottom-left gold glow -->
<ellipse cx="180" cy="950" rx="280" ry="200" fill="url(#rg2)"/>

<!-- Decorative flowing curves - rose -->
<path d="M-50,200 C150,120 350,280 550,180 S850,120 900,220" stroke="#8B4557" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>
<path d="M-50,235 C180,155 380,310 580,210 S820,155 880,250" stroke="#6B3A5B" stroke-width="0.8" fill="none" opacity="0.18" stroke-linecap="round"/>

<!-- Gold accent lines -->
<path d="M-50,850 C200,800 420,920 650,850 S850,780 900,860" stroke="#D4A017" stroke-width="1.2" fill="none" opacity="0.2" stroke-linecap="round"/>
<path d="M-50,880 C220,830 440,940 640,875 S840,810 880,885" stroke="#B8860B" stroke-width="0.6" fill="none" opacity="0.14" stroke-linecap="round"/>

<!-- Geometric rose elements -->
<circle cx="720" cy="880" r="45" stroke="#8B4557" stroke-width="0.5" fill="none" opacity="0.15"/>
<circle cx="720" cy="880" r="25" stroke="#D4A017" stroke-width="0.3" fill="none" opacity="0.12"/>
<circle cx="720" cy="880" r="10" fill="#C9A0B5" opacity="0.1"/>

<!-- Small accent dots - gold -->
<circle cx="120" cy="180" r="4" fill="#D4A017" opacity="0.2"/>
<circle cx="140" cy="200" r="2.5" fill="#C9A0B5" opacity="0.15"/>
<circle cx="680" cy="1050" r="3" fill="#D4A017" opacity="0.18"/>
<circle cx="700" cy="1035" r="1.5" fill="#C9A0B5" opacity="0.12"/>

<!-- Top edge gold line -->
<line x1="60" y1="55" x2="734" y2="55" stroke="#D4A017" stroke-width="0.4" opacity="0.2" stroke-linecap="round"/>

<!-- Bottom corner decorative arc -->
<path d="M50,1070 A40,40 0 0,1 90,1030" stroke="#8B4557" stroke-width="0.5" fill="none" opacity="0.15"/>
</svg></body></html>
